<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142C44" />
      <stop offset="100%" stop-color="#0A1826" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C59B27" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield & Icon Symbol -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Border -->
    <path d="M50 5 L90 20 C90 65 50 92 50 95 C50 92 10 65 10 20 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Inner Gold Shield Accent -->
    <path d="M50 14 L82 26 C82 61 50 84 50 84 C50 84 18 61 18 26 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6" stroke-dasharray="3,2" />

    <!-- Scales / Geometric Pillar Inside -->
    <!-- Pillar Base -->
    <rect x="47" y="32" width="6" height="38" rx="1" fill="url(#goldGrad)" />
    <!-- Balance Beam -->
    <path d="M28 42 L72 42" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Left Scale -->
    <path d="M33 42 L25 56 M33 42 L41 56" stroke="url(#goldGrad)" stroke-width="1.2" />
    <path d="M23 56 C23 60 43 60 43 56 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Right Scale -->
    <path d="M67 42 L59 56 M67 42 L75 56" stroke="url(#goldGrad)" stroke-width="1.2" />
    <path d="M57 56 C57 60 77 60 77 56 Z" fill="url(#goldGrad)" opacity="0.85" />
    <!-- Crown / Apex -->
    <polygon points="50,22 55,30 45,30" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  </g>

  <!-- Typography: مؤسسة الدفاع -->
  <g transform="translate(130, 0)">
    <!-- Primary Name -->
    <text x="0" y="58" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-weight="900" font-size="38" fill="#0E243A" letter-spacing="-0.5">
      مُؤسَّسَة الدِّفَاع
    </text>
    
    <!-- Gold Subtitle Badge -->
    <text x="2" y="86" font-family="'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-weight="700" font-size="14.5" fill="#B3861B" letter-spacing="0.5">
      تأسيس الشركات • تراخيص المصانع • خدمات كبار المستثمرين
    </text>
    
    <!-- English Micro Subtitle for Executive Touch -->
    <text x="3" y="104" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="600" font-size="10" fill="#718096" letter-spacing="2">
      EL-DEFAA EXECUTIVE BUSINESS &amp; INDUSTRIAL CONSULTING
    </text>
  </g>
</svg>
